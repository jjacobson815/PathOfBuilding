name: Update SimpleGraphic DLLs (Retired)
# Retired in Phase 14.3: the Qt6/QML port replaces SimpleGraphic completely.
# Kept gated on manual workflow_dispatch only so legacy dispatch events do not
# open noisy PRs or fail fork CI.
on:
  workflow_dispatch:

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Retired notice
        run: echo "SimpleGraphic has been replaced by the Qt6/QML host (app/src/main.cpp). This workflow is retired."

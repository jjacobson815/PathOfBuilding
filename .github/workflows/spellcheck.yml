name: Spell Checker

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to checkout
        default: dev
        required: false

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    env:
      CONFIG_URL:  https://raw.githubusercontent.com/Nightblade/pob-dict/main
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Fetch config file and dictionaries
        run:
          curl --silent --show-error --parallel --remote-name-all
            ${{ env.CONFIG_URL }}/cspell.json
            ${{ env.CONFIG_URL }}/pob-dict.txt
            ${{ env.CONFIG_URL }}/poe-dict.txt
            ${{ env.CONFIG_URL }}/ignore-dict.txt
            ${{ env.CONFIG_URL }}/extra-en-dict.txt
            ${{ env.CONFIG_URL }}/contribs-dict.txt

      # Qt port: the upstream dictionaries only know PoB/PoE terms, so skip the
      # port's own code, docs and build files. Legacy src/ is still checked.
      # (cspell.json has comments, so wrap it via "import" instead of editing it.)
      - name: Skip Qt port paths
        run: |
          cat > cspell-ci.json <<'EOF'
          {
            "import": ["./cspell.json"],
            "ignorePaths": ["app/**", "port-plan/**", "docker/**", "HANDOFF-*.md", "tools/linux-selftest.sh"]
          }
          EOF

      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v8
        with:
          files: '**' # needed as workaround for non-incremental runs (overrides in config still work ok)
          config: "cspell-ci.json"
          incremental_files_only: ${{ github.event_name != 'workflow_dispatch' }}

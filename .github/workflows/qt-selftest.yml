name: Qt Self-Test & CI Matrix
# Phase 14.3 gate: build and verify the Qt6/QML + LuaJIT frontend on both
# Linux and Windows (selftest + headless + visual/smoke tool checks).
# Complements test.yml (which runs the host-agnostic busted calc-parity specs).
on:
  push:
    branches: [ dev, main, master ]
  pull_request:
    branches: [ dev, main, master ]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Docker selftest + headless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dev
          tags: pob-qt-dev:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Headless self-test + offscreen GUI smoke test
        run: docker run --rm -v "${{ github.workspace }}:/workdir" -w /workdir pob-qt-dev:ci sh docker/run-selftest.sh

  windows:
    name: Windows (MSYS2 MinGW64 Qt6 build + selftest + headless)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-imageformats
            mingw-w64-x86_64-luajit
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-zlib
      - name: Configure & Build
        run: |
          cmake -S app -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build-win pob-selftest pob-qt pob-ui-test
      - name: Run QML lint
        shell: pwsh
        run: python tools/lint_qml.py
      - name: Run pob-selftest
        run: |
          cd src
          QT_FORCE_STDERR_LOGGING=1 ../build-win/pob-selftest.exe "$PWD" "$PWD/../runtime" "$PWD/../app/lua/pob_host.lua"
      - name: Run pob-qt --headless
        run: |
          cd src
          QT_FORCE_STDERR_LOGGING=1 ../build-win/pob-qt.exe --headless --src "$PWD" --runtime "$PWD/../runtime" --host "$PWD/../app/lua/pob_host.lua"
      - name: Run pob-ui-test
        run: |
          cd src
          QT_FORCE_STDERR_LOGGING=1 ../build-win/pob-ui-test.exe -input ../app/tests/ui
      - name: Verify visual/smoke tooling
        shell: pwsh
        run: |
          python -m pip install --quiet pillow numpy
          python tools/verify_style.py --capture-dir app/tests/capture-baseline
          python tools/verify_views_smoke.py --help
